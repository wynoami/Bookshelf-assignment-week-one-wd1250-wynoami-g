<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookshelf</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Bookshelf</h1>

        <form id="bookForm">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required>

            <label for="author">Author</label>
            <input type="text" id="author" name="author" required>

            <label for="pages">Pages</label>
            <input type="number" id="pages" name="pages" min="1" required>

            <div class="radio-group">
                <label>
                    <input type="radio" name="bookType" value="fiction" required>
                    Fiction
                </label>
                <label>
                    <input type="radio" name="bookType" value="nonfiction">
                    Non-Fiction
                </label>
            </div>

            <label for="category" id="categoryLabel">Theme / Subject</label>
            <input type="text" id="category" name="category" required>

            <button type="submit">Submit</button>
        </form>

        <hr>

        <p id="emptyMessage">No items in the bookshelf</p>
        <ul id="bookList"></ul>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
